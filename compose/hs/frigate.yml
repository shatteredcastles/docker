services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    restart: unless-stopped
    shm_size: "512mb"
    networks:
      - t3_proxy
      - default
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb  # Optional: Coral USB
    ports:
      - "5000:5000"
      # RTSP restream for Home Assistant (host network, connects via 127.0.0.1)
      - "127.0.0.1:8554:8554"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $DOCKERDIR/appdata/frigate/config:/config
      - $LOCALDATADIR/video/frigate:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 100000000
      - $DOCKERDIR/logs/frigate:/log
    environment:
      # - FRIGATE_MQTT_USER=$FRIGATE_MQTT_USER
      # - FRIGATE_MQTT_PASS=$FRIGATE_MQTT_PASS
      - FRIGATE_RTSP_PASSWORD=$REOLINK_PASS
      # - REOLINK_USER=${REOLINK_USER}
      - REOLINK_PASS=$REOLINK_PASS
      - FRIGATE_MQTT_USER=$FRIGATE_MQTT_USER
      - FRIGATE_MQTT_PASS=$FRIGATE_MQTT_PASS
      - TZ=America/Denver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.frigate-rtr.entrypoints=websecure"
      - "traefik.http.routers.frigate-rtr.rule=Host(`frigate.$DOMAINNAME`)"
      # Middlewares
      # - "traefik.http.routers.frigate-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.frigate-rtr.middlewares=chain-oauth@file" # For Google OAuth
      # HTTP Services
      - "traefik.http.routers.frigate-rtr.service=frigate-svc"
      - "traefik.http.services.frigate-svc.loadbalancer.server.port=5000"
      # AUTO-UPDATE: weekly update-containers.sh; Diun skips these
      - "homelab.auto-update=true"
      - "diun.enable=false"
      # Homepage Setup
      - homepage.group=Smart Home
      - homepage.name=Frigate
      - homepage.icon=frigate.png
      - homepage.href=https://frigate.$DOMAINNAME
      - homepage.widget.type=frigate
      - homepage.widget.url=http://frigate:5000
