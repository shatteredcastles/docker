services:
  # Nextcloud - Self-hosted file sync & storage (NAS-backed data dir)
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    networks:
      - t3_proxy
      - nextcloud_internal
    volumes:
      - $DOCKERDIR/appdata/nextcloud/config:/config
      - $DATADIR/nextcloud:/data
      - $USERDIR:/mnt/user:ro
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    labels:
      - "traefik.enable=true"
      # HTTP Router - own login (2FA capable), so it skips Authelia SSO like Vaultwarden/Baikal
      # to keep desktop sync, mobile app, and CalDAV/CardDAV clients working
      - "traefik.http.routers.nextcloud-rtr.entrypoints=websecure"
      - "traefik.http.routers.nextcloud-rtr.rule=Host(`nextcloud.$DOMAINNAME`)"
      - "traefik.http.routers.nextcloud-rtr.tls=true"
      - "traefik.http.routers.nextcloud-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.nextcloud-rtr.service=nextcloud-svc"
      # LSIO image only serves self-signed HTTPS on 443 internally
      - "traefik.http.services.nextcloud-svc.loadbalancer.server.port=443"
      - "traefik.http.services.nextcloud-svc.loadbalancer.server.scheme=https"
      - "traefik.http.services.nextcloud-svc.loadbalancer.serverstransport=nextcloud-transport@file"
      # AUTO-UPDATE: weekly update-containers.sh; Diun skips these
      - "homelab.auto-update=true"
      - "diun.enable=false"
      # Homepage Setup
      - homepage.group=Files
      - homepage.name=Nextcloud
      - homepage.icon=nextcloud.png
      - homepage.href=https://nextcloud.$DOMAINNAME
      - homepage.description=Self-hosted file sync & storage (NAS-backed)

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NC_POSTGRES_DB}
      POSTGRES_USER: ${NC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NC_POSTGRES_PASSWORD}
    volumes:
      - $DOCKERDIR/appdata/nextcloud/postgres:/var/lib/postgresql/data
    networks:
      - nextcloud_internal

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - $DOCKERDIR/appdata/nextcloud/redis:/data
    networks:
      - nextcloud_internal

networks:
  nextcloud_internal:
    driver: bridge
