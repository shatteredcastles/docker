services:
  # Homepage - Application Dashboard
  # https://gethomepage.dev/main/
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest

    networks:
      - t3_proxy
      - socket_proxy
    # ports:
    #  - $homepage_port:3000

    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

    volumes:
      - $DOCKERDIR/appdata/homepage:/app/config
      - $USERDIR/Pictures:/app/public/images
      # Mount points for the disk widgets in appdata/homepage/widgets.yaml
      - $MEDIADIR:/mnt/media:ro
      - $DOWNLOADSDIR:/mnt/downloads:ro
      - $DATADIR:/mnt/data:ro

    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      HOMEPAGE_ALLOWED_HOSTS: $DOMAINNAME, $SERVER_IP:$homepage_port
      # {{HOMEPAGE_VAR_*}} placeholders in appdata/homepage/services.yaml
      HOMEPAGE_VAR_ADGUARD_USERNAME: $ADGUARD_USERNAME
      HOMEPAGE_VAR_ADGUARD_PASSWORD: $ADGUARD_PASSWORD
      HOMEPAGE_VAR_GCAL_ICAL_URL: $GCAL_ICAL_URL

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.homepage-rtr.entrypoints=websecure"
      - "traefik.http.routers.homepage-rtr.rule=Host(`$DOMAINNAME`) || Host(`www.$DOMAINNAME`)"
      # Middlewares
      - "traefik.http.routers.homepage-rtr.middlewares=chain-oauth@file"
      # HTTP Services
      - "traefik.http.routers.homepage-rtr.service=homepage-svc"
      - "traefik.http.services.homepage-svc.loadbalancer.server.port=3000"
      # AUTO-UPDATE: weekly update-containers.sh; Diun skips these
      - "homelab.auto-update=true"
      - "diun.enable=false"
