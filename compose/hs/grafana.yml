services:
  # Grafana - Graphical data visualization for InfluxDB data
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - t3_proxy
      - default
    # ports:
    #   - 3000:3000
    user: "$PUID:$PGID"
    volumes:
      - $DOCKERDIR/appdata/grafana:/var/lib/grafana
    environment:
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource,grafana-worldmap-panel,grafana-piechart-panel"
      # Grafana's only gate is Google OAuth in front of it (grafana-rtr), so
      # anyone who gets through is treated as admin; no second login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Home Assistant embeds Grafana via *public dashboards*
      # (Share -> Share externally), served without OAuth by grafana-public-rtr.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.grafana-rtr.entrypoints=websecure"
      - "traefik.http.routers.grafana-rtr.rule=Host(`grafana.$DOMAINNAME`)"
      # Middlewares
      - "traefik.http.routers.grafana-rtr.middlewares=chain-oauth@file"
      # HTTP Services
      - "traefik.http.routers.grafana-rtr.service=grafana-svc"
      - "traefik.http.services.grafana-svc.loadbalancer.server.port=3000"
      # AUTO-UPDATE: weekly update-containers.sh; Diun skips these
      - "homelab.auto-update=true"
      - "diun.enable=false"
      # Public dashboards for Home Assistant iframes: no OAuth, reachable from
      # anywhere. Only the public-dashboard page, its API and static assets are
      # exposed; each dashboard needs its own unguessable access token.
      # No secure-headers middleware: its X-Frame-Options would block the iframe.
      - "traefik.http.routers.grafana-public-rtr.entrypoints=websecure"
      - "traefik.http.routers.grafana-public-rtr.rule=Host(`grafana.$DOMAINNAME`) && (PathPrefix(`/public-dashboards/`) || PathPrefix(`/api/public/`) || PathPrefix(`/public/`))"
      - "traefik.http.routers.grafana-public-rtr.middlewares=middlewares-traefik-bouncer@file,middlewares-rate-limit@file"
      - "traefik.http.routers.grafana-public-rtr.service=grafana-svc"
