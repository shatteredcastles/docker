services:
  # RustDesk Server - Self-hosted remote desktop rendezvous + relay
  # https://github.com/rustdesk/rustdesk-server
  rustdesk-hbbs:
    container_name: rustdesk-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r rustdesk.$DOMAINNAME
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    volumes:
      - $DOCKERDIR/appdata/rustdesk:/root
    environment:
      - TZ=$TZ
    depends_on:
      - rustdesk-hbbr
    labels:
      - "homelab.auto-update=true"
      - "diun.enable=false"

  rustdesk-hbbr:
    container_name: rustdesk-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - 21117:21117
      - 21119:21119
    volumes:
      - $DOCKERDIR/appdata/rustdesk:/root
    environment:
      - TZ=$TZ
    labels:
      - "homelab.auto-update=true"
      - "diun.enable=false"
