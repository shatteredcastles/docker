services:
  # Portainer - WebUI for Containers
  portainer:
    container_name: portainer
    image: portainer/portainer-ee:latest # Upgraded for Docker v29 compatibility
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - t3_proxy
      - socket_proxy_rw
    # command: -H unix:///var/run/docker.sock # # Use Docker Socket Proxy instead for improved security
    command: -H tcp://socket-proxy-rw:2375
    # ports:
    #   - $portainer_port:9000
    volumes:
      # - /var/run/docker.sock:/var/run/docker.sock:ro # # Use Docker Socket Proxy instead for improved security
      - $DOCKERDIR/appdata/portainer/data:/data # Change to local directory if you want to save/transfer config locally
    environment:
      - TZ=$TZ
      - DOCKER_HOST=tcp://socket-proxy-rw:2375
      - DOCKER_API_VERSION=1.45
    labels:
      #- "traefik.enable=true"
      # HTTP Routers
      #- "traefik.http.routers.portainer-rtr.entrypoints=websecure"
      #- "traefik.http.routers.portainer-rtr.rule=Host(`portainer.$DOMAINNAME_HS`)"
      # Middlewares
      #- "traefik.http.routers.portainer-rtr.middlewares=chain-oauth@file"
      # HTTP Services
      #- "traefik.http.routers.portainer-rtr.service=portainer-svc"
      #- "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.portainer-rtr.entrypoints=websecure"
      - "traefik.http.routers.portainer-rtr.rule=Host(`portainer.$DOMAINNAME`)"
      # Middlewares
      #- "traefik.http.routers.portainer-rtr.middlewares=chain-no-auth@file"
      #- "traefik.http.routers.portainer-rtr.middlewares=chain-basic-auth@file"
      - "traefik.http.routers.portainer-rtr.middlewares=chain-oauth@file" # For Google OAuth
      # HTTP Services
      - "traefik.http.routers.portainer-rtr.service=portainer-svc"
      - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"
      # AUTO-UPDATE: weekly update-containers.sh; Diun skips these
      - "homelab.auto-update=true"
      - "diun.enable=false"
      # Homepage Setup
      - homepage.group=Home Server
      - homepage.name=Portainer
      - homepage.icon=portainer.png
      - homepage.href=https://portainer.$DOMAINNAME
      # Homepage Widget Setup
      - homepage.widget.type=portainer
      - homepage.widget.url=http://portainer:9000
      - homepage.widget.env=1
      - homepage.widget.key=$PORTAINER_API_KEY
