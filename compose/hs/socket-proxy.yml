services:
  # Docker Socket Proxy - filtered access to the Docker API.
  # Two instances: read-only for anything that just needs to see containers,
  # read-write only for the few services that manage them. Write access to
  # Docker is effectively root on the host, so keep that list short.
  # Neither is published on the host.

  # READ-ONLY: traefik, homepage, glances, dozzle, telegraf, diun
  socket-proxy:
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy:latest
    security_opt:
      - no-new-privileges:true
    restart: always
    networks:
      socket_proxy:
        ipv4_address: 192.168.91.254
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
      # 1 = allow GET on that API prefix. POST=0 blocks every write.
      - POST=0
      - EVENTS=1
      - PING=1
      - VERSION=1
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
    labels:
      - "homelab.auto-update=true"
      - "diun.enable=false"

  # READ-WRITE: portainer, deunhealth
  socket-proxy-rw:
    container_name: socket-proxy-rw
    image: tecnativa/docker-socket-proxy:latest
    security_opt:
      - no-new-privileges:true
    restart: always
    networks:
      socket_proxy_rw:
        ipv4_address: 192.168.92.254
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - LOG_LEVEL=info
      - POST=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - VOLUMES=1
      - SERVICES=1 # Portainer
      - TASKS=1 # Portainer
    labels:
      - "homelab.auto-update=true"
      - "diun.enable=false"
