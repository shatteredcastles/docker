services:
  # seerr - Media Requests and Discovery for Jellyfin (successor to Jellyseerr)
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - t3_proxy
    volumes:
      - $DOCKERDIR/appdata/seerr:/app/config
    environment:
      TZ: $TZ
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.seerr-rtr.entrypoints=websecure"
      - "traefik.http.routers.seerr-rtr.rule=Host(`seerr.$DOMAINNAME`)"
      # Middlewares
      - "traefik.http.routers.seerr-rtr.middlewares=chain-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.seerr-rtr.service=seerr-svc"
      - "traefik.http.services.seerr-svc.loadbalancer.server.port=5055"
      # UPDATE IMAGE
      - "com.centurylinklabs.watchtower.enable=true"
      # Homepage Setup
      - homepage.group=Media Stack
      - homepage.name=Seerr
      - homepage.icon=jellyseerr.png
      - homepage.href=http://seerr.$DOMAINNAME
      - homepage.weight=0
      - homepage.widget.type=jellyseerr
      - homepage.widget.url=http://seerr:5055
      - homepage.widget.key=$JELLYSEERR_API_KEY
