services:
  # NUT (the UPS server) runs on the Proxmox host, which the UPS is plugged into over USB.
  peanut:
    image: brandawg93/peanut:latest
    container_name: peanut
    environment:
      - NUT_HOST=192.168.0.10
      - NUT_PORT=3493
      - WEB_PORT=8080
      - AUTH_DISABLED=true
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
    restart: unless-stopped
    ports:
      - $peanut_port:8080
    networks:
      - t3_proxy
      - default
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata:/temp
      - $DOCKERDIR/appdata/logs/hs/peanut:/app/Logs
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.peanut-rtr.entrypoints=websecure"
      - "traefik.http.routers.peanut-rtr.rule=Host(`peanut.$DOMAINNAME`)"
      # Middlewares
      #- "traefik.http.routers.peanut-rtr.middlewares=chain-oauth@file"
      - "traefik.http.routers.peanut-rtr.middlewares=chain-no-auth@file"

      # HTTP Services
      - "traefik.http.routers.peanut-rtr.service=peanut-svc"
      - "traefik.http.services.peanut-svc.loadbalancer.server.port=8080"
      # AUTO-UPDATE: weekly update-containers.sh; Diun skips these
      - "homelab.auto-update=true"
      - "diun.enable=false"
      # Homepage Setup
      - homepage.group=Smart Home
      - homepage.name=UPS Status
      - homepage.icon=peanut.png
      - homepage.href=http://peanut.$DOMAINNAME
      - homepage.widget.type=peanut
      - homepage.widget.url=http://peanut:8080
      - homepage.widget.key=ups
