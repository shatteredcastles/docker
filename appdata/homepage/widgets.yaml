---
# Header widgets, shown on every tab.
# https://gethomepage.dev/configs/info-widgets/

# `disk:` is a mount point *inside* the homepage container (see the volumes
# in compose/hs/homepage.yml), not the NFS source.
- resources:
    label: hs
    cpu: true
    memory: true
    disk: /

- resources:
    label: NAS Media
    disk: /mnt/media

- resources:
    label: NAS Downloads
    disk: /mnt/downloads

- resources:
    label: NAS Data
    disk: /mnt/data

- search:
    provider: duckduckgo
    target: _blank

- openmeteo:
    label: Home
    latitude: 40.16732
    longitude: -105.1019
    timezone: America/Denver
    units: imperial
    cache: 5 # minutes

- datetime:
    text_size: 4x1
    format:
      timeStyle: short
      dateStyle: short
