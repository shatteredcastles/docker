---
# https://gethomepage.dev/configs/settings/

title: Shattered Castle
theme: dark
color: slate

background:
  image: /images/Dall-E image.png
  blur: sm
  saturate: 50
  brightness: 75
  opacity: 50

# Groups and tabs. Docker-label services pick their group with
# `homepage.group=...`; services outside Docker are in services.yaml.
layout:
  # Home
  - Calendar:
      tab: Home
      header: false
  - Smart Home:
      tab: Home
      style: row
      columns: 3
  - Files:
      tab: Home
      style: row
      columns: 3

  # Media
  - Media:
      tab: Media
      style: row
      columns: 3
  - Media Stack:
      tab: Media
      style: row
      columns: 3

  # Money
  - Finance:
      tab: Money
      style: row
      columns: 3

  # Infra
  - Monitoring:
      tab: Infra
      style: row
      columns: 3
  - Home Server:
      tab: Infra
      style: row
      columns: 3
