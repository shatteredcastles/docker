- Calendar:
    - " ":
        widget:
          type: calendar
          firstDayInWeek: sunday
          view: monthly
          maxEvents: 10
          showTime: true
          timezone: America/Denver
          integrations:
            - type: sonarr
              service_group: Media Stack
              service_name: Sonarr
              color: teal
            - type: radarr
              service_group: Media Stack
              service_name: Radarr
              color: teal
            - type: ical
              url: https://calendar.google.com/calendar/ical/jeearle%40gmail.com/private-b8b8a770c8ef9aa064fb552e6d61b376/basic.ics
              name: My Events
              color: zinc
              params:
                showName: true


# Services that run outside Docker on Proxmox. Docker-label services in the
# same groups are merged in automatically.
- Smart Home:
    - Home Assistant:
        icon: home-assistant.png
        href: https://haos.shatteredcastle.com
        siteMonitor: http://192.168.0.57:8123
        description: haos VM

- Monitoring:
    - AdGuard Home:
        icon: adguard-home.png
        href: https://adguard.shatteredcastle.com
        description: dns LXC
        widget:
          type: adguard
          url: http://192.168.0.53:80
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
