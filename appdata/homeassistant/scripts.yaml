morning_routine:
  alias: Morning Routine
  description: Time, calendar, weather, and news briefing on the living room Sonos
  sequence:
  - alias: Set volume
    action: media_player.volume_set
    target:
      entity_id: media_player.sonos_living_room
    data:
      volume_level: 0.4
  - alias: Greet with time and date
    action: tts.speak
    target:
      entity_id: tts.piper
    data:
      media_player_entity_id: media_player.sonos_living_room
      options:
        voice: en_GB-vctk-medium
      message: >-
        {% set hour = now().strftime('%-I') %}
        {% set minute = now().minute %}
        {% set ampm = now().strftime('%p') %}
        {% if minute == 0 %}
          {% set time_phrase = hour ~ ' ' ~ ampm %}
        {% elif minute < 10 %}
          {% set time_phrase = hour ~ ' oh ' ~ minute ~ ' ' ~ ampm %}
        {% else %}
          {% set time_phrase = hour ~ ':' ~ '%02d' % minute ~ ' ' ~ ampm %}
        {% endif %}
        Good morning! It's {{ time_phrase }} on {{ now().strftime('%A, %B %-d') }}.
  - alias: Get today's calendar events
    action: calendar.get_events
    target:
      entity_id:
      - calendar.jeearle_gmail_com
      - calendar.family
    data:
      start_date_time: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
      end_date_time: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(days=1) }}"
    response_variable: todays_events
  - alias: Announce calendar
    action: tts.speak
    target:
      entity_id: tts.piper
    data:
      media_player_entity_id: media_player.sonos_living_room
      options:
        voice: en_GB-vctk-medium
      message: >-
        {% set events = (todays_events.get('calendar.jeearle_gmail_com', {}).get('events', [])
           + todays_events.get('calendar.family', {}).get('events', []))
           | sort(attribute='start') %}
        {% if events | length == 0 %}
        You have nothing on your calendar today.
        {% else %}
        On your calendar today:
        {% for e in events %}{{ e.summary }}{% if 'T' in e.start %} at {{ as_datetime(e.start).strftime('%-I:%M %p') }}{% endif %}{% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
  - alias: Get weather forecast
    action: weather.get_forecasts
    target:
      entity_id: weather.home
    data:
      type: daily
    response_variable: weather_forecast
  - alias: Announce weather
    action: tts.speak
    target:
      entity_id: tts.piper
    data:
      media_player_entity_id: media_player.sonos_living_room
      options:
        voice: en_GB-vctk-medium
      message: >-
        {% set today = weather_forecast['weather.home']['forecast'][0] %}
        {% set tomorrow = weather_forecast['weather.home']['forecast'][1] %}
        Right now it's {{ state_attr('weather.home', 'temperature') }} degrees and {{ states('weather.home') | replace('-', ' ') }}.
        Today's high will be {{ today.temperature }} with a low of {{ today.templow }}.
        Tomorrow, expect a high of {{ tomorrow.temperature }} and {{ tomorrow.condition | replace('-', ' ') }}.
  - alias: Get tonight's dinner from Mealie
    action: calendar.get_events
    continue_on_error: true
    target:
      entity_id: calendar.mealie_dinner
    data:
      start_date_time: "{{ today_at('00:00') }}"
      end_date_time: "{{ today_at('23:59') }}"
    response_variable: dinner_plan
  - alias: Announce dinner (if planned)
    if:
    - condition: template
      value_template: "{{ (dinner_plan or {}).get('calendar.mealie_dinner', {}).get('events', []) | count > 0 }}"
    then:
    - action: tts.speak
      target:
        entity_id: tts.piper
      data:
        media_player_entity_id: media_player.sonos_living_room
        options:
          voice: en_GB-vctk-medium
        message: >-
          Tonight's dinner is {{ dinner_plan['calendar.mealie_dinner'].events[0].summary | replace(' Recipe', '') }}.
  - alias: Fetch NPR feed
    action: rest_command.fetch_npr_feed
    response_variable: npr_feed
  - alias: Fetch CNBC Tech Check feed
    action: rest_command.fetch_cnbc_feed
    response_variable: cnbc_feed
  - alias: Fetch Marketplace Morning Report feed
    action: rest_command.fetch_marketplace_feed
    response_variable: marketplace_feed
  - alias: Play NPR Update
    action: music_assistant.play_media
    target:
      entity_id: media_player.sonos_living_room
    data:
      media_id: '{{ (npr_feed["content"] | regex_findall("<enclosure[^>]*url=\"([^\"]+)\""))[0] | replace("&amp;", "&") }}'
      enqueue: replace
  - alias: Queue CNBC Tech Check
    action: music_assistant.play_media
    target:
      entity_id: media_player.sonos_living_room
    data:
      media_id: '{{ (cnbc_feed["content"] | regex_findall("<enclosure[^>]*url=\"([^\"]+)\""))[0] | replace("&amp;", "&") }}'
      enqueue: add
  - alias: Queue Marketplace Morning Report
    action: music_assistant.play_media
    target:
      entity_id: media_player.sonos_living_room
    data:
      media_id: '{{ (marketplace_feed["content"] | regex_findall("<enclosure[^>]*url=\"([^\"]+)\""))[0] | replace("&amp;", "&") }}'
      enqueue: add
  mode: single
stop_morning_routine:
  alias: Stop Morning Routine
  description: Stops the morning routine playback
  sequence:
  - action: media_player.media_stop
    target:
      entity_id: media_player.sonos_living_room
  mode: single
