automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

tts:
  - platform: google_translate
    service_name: google_say

influxdb:
  api_version: 2
  host: 192.168.0.56
  port: 8086
  token: "Eibfdlzt_1EzqrhE1RlRdhiW99Tgqy02iCLYsoUIrieWSf_-J9YMYTSG9a-bSN6IH5VvAXyY5Jg_wGnty5kasg=="
  organization: "ShatteredCastle"
  bucket: "homeassistant"
  ssl: false
input_boolean:
  wall_tablet_hide_katie:
    name: Hide Katie on wall tablet
    icon: mdi:account-off
input_number:
  irrigation_total_gal:
    name: Irrigation Total (gal)
    min: 0
    max: 100000
    step: 0.001
    mode: box
template:
  - sensor:
      - name: "Irrigation Total"
        unique_id: irrigation_total_sensor
        state: "{{ states('input_number.irrigation_total_gal')|float(0) }}"
        unit_of_measurement: "gal"
        device_class: water
        state_class: total_increasing
  # Where people are, for the wall tablet: Home / At work / Heading home / Away.
  # Trigger-based so each can compare against its own previous distance
  # (this.attributes) to tell which way they're travelling. Drive time comes
  # from the Waze Travel Time sensors sensor.<name>_eta_home when they exist,
  # otherwise the distance in miles is shown.
  - triggers:
      - trigger: state
        entity_id: person.james_2
      - trigger: state
        entity_id: sensor.james_eta_home
      - trigger: homeassistant
        event: start
    sensor:
      - name: "James location"
        unique_id: james_location_status
        icon: >-
          {% set s = states('person.james_2') %}
          {% if s == 'home' %}mdi:home-account
          {% elif s == 'Work' %}mdi:briefcase
          {% elif s in ['unknown', 'unavailable'] %}mdi:account-question
          {% elif this.attributes.direction | default('') == 'towards' %}mdi:home-import-outline
          {% else %}mdi:map-marker-distance{% endif %}
        state: >-
          {% set s = states('person.james_2') %}
          {% set d = (distance('person.james_2') if has_value('person.james_2') else none) %}
          {% set prev = this.attributes.distance_mi | default(none) %}
          {% set dir = this.attributes.direction | default('unknown') %}
          {% if d is number and prev is number %}
            {% set dir = 'towards' if d < prev - 0.25 else ('away' if d > prev + 0.25 else dir) %}
          {% endif %}
          {% set eta = states('sensor.james_eta_home') | float(none) %}
          {% set far = (d | round(0) | int if d >= 10 else d | round(1)) ~ ' mi' if d is number else '' %}
          {% set howfar = ((eta // 60) | int ~ ' h ' ~ (eta % 60) | int ~ ' min' if eta >= 60 else eta | int ~ ' min') if eta is number else far %}
          {% if states.person.james_2 is none %}Not set up
          {% elif s == 'home' %}Home
          {% elif s == 'Work' %}At work{{ ' · ' ~ howfar if eta is number else '' }}
          {% elif d is not number %}Unknown
          {% elif dir == 'towards' %}Heading home · {{ howfar }}
          {% elif s != 'not_home' %}{{ s }}
          {% else %}Away · {{ howfar }}{% endif %}
        attributes:
          distance_mi: >-
            {% set d = (distance('person.james_2') if has_value('person.james_2') else none) %}
            {{ d | round(2) if d is number else none }}
          direction: >-
            {% set s = states('person.james_2') %}
            {% set d = (distance('person.james_2') if has_value('person.james_2') else none) %}
            {% set prev = this.attributes.distance_mi | default(none) %}
            {% set dir = this.attributes.direction | default('unknown') %}
            {% if s == 'home' %}arrived
            {% elif d is number and prev is number %}
              {{ 'towards' if d < prev - 0.25 else ('away' if d > prev + 0.25 else dir) }}
            {% else %}{{ dir }}{% endif %}
  # Katie: placeholder until she has the HA Companion app (person.katie).
  - triggers:
      - trigger: state
