http:
  routers:
    haos-rtr:
      rule: "Host(`haos.shatteredcastle.com`)" 
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
        - middlewares-websocket
      service: haos-svc
      tls:
        certResolver: dns-cloudflare
  services:
    haos-svc:
      loadBalancer:
        servers:
          - url: "http://192.168.0.57:8123"  # haos VM on Proxmox
