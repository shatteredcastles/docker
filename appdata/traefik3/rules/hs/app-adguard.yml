http:
  routers:
    adguard-rtr:
      rule: "Host(`adguard.shatteredcastle.com`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-lan-oauth
      service: adguard-svc
      tls:
        certResolver: dns-cloudflare
  services:
    adguard-svc:
      loadBalancer:
        servers:
          - url: "http://192.168.0.53:80"  # dns LXC on Proxmox
