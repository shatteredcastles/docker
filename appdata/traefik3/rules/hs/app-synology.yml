http:
  routers:
    # Synology DSM. LAN/Tailscale only; DSM has its own login.
    synology-rtr:
      rule: "Host(`synology.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - middlewares-lan-only
      service: synology-svc
      tls:
        certResolver: dns-cloudflare
        options: tls-opts@file
  services:
    synology-svc:
      loadBalancer:
        serversTransport: selfsigned-transport
        passHostHeader: false # DSM returns 404 for hostnames it doesn't know
        servers:
          - url: "https://192.168.0.2:5001"
